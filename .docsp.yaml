# docs-platform checks itself (dogfooding). Contract: contracts/config-v1.schema.json
version: 1
docs: ["*.md"]
exclude: ["testdata/", "CHANGELOG*.md", "LICENSE*", "**/testdata/"]
min_confidence: medium
impact:
  trailer: Docs-Not-Needed
  rules:
    - name: cli
      code: ["cmd/docsp/**"]
      docs: ["README.md", "docs/**"]
    - name: contracts
      code: ["contracts/**", "internal/findings/**", "internal/config/**"]
      docs: ["docs/contracts.md", "docs/design.md"]
    - name: extractors
      code: ["internal/extract/**", "internal/refclass/**"]
      docs: ["README.md", "docs/design.md"]
    - name: action
      code: ["action.yml"]
      docs: ["README.md"]
    - name: models
      code: ["internal/judge/**", "internal/instance/**", "internal/evalmodel/**", "judgev1/**", "providers/**"]
      docs: ["README.md", "docs/design.md", "docs/contracts.md"]
ignore:
  - kind: env_var
    text: DOCSP_FAKE
    reason: test-only switch that turns the test binary into a fake provider process
  - kind: env_var
    text: CLAUDE_CODE_OAUTH_TOKEN
    reason: Claude Code's own CI token variable (external); docs-platform only passes it through by name
